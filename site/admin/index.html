<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>(function(){try{var s=localStorage.getItem('osh_theme');var d=s?s==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.classList.toggle('dark',d)}catch(e){}})();</script>

  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0277C8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/osh/osh.css">
</head>
<body>
  <div id="site-header"></div>
  <main id="main">
    <div class="container">
      <header class="page-head">
        <span class="eyebrow">Management overview</span>
        <div class="head-row"><h1>OSH Admin Dashboard</h1><span id="admin-who"></span></div>

      <div id="admin-root" aria-live="polite"></div>
    </div>

  <div id="site-footer"></div>
